<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
<h:head>
    <title>Create Enrollment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Modern UI Enhancements -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa !important; }
        .navbar { background: linear-gradient(135deg, #0d42ff, #0dcaf0) !important; border-bottom: none; }
        .card { border-radius: 16px !important; box-shadow: 0 12px 35px rgba(0,0,0,0.05) !important; border: 1px solid rgba(0,0,0,0.05) !important; transition: transform 0.2s ease-in-out, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 15px 45px rgba(0,0,0,0.1) !important; }
        .btn-primary { background: linear-gradient(135deg, #0d42ff, #0dcaf0); border: none; border-radius: 8px; font-weight: 500; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(13, 202, 240, 0.4); }
        .btn-outline-primary { border-radius: 8px; font-weight: 500; }
        .table { border-collapse: separate; border-spacing: 0; }
        .table thead th { background-color: #f8f9fa; color: #495057; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; border-bottom: 2px solid #e9ecef; }
        .table-hover tbody tr:hover { background-color: #f8faff; transform: scale(1.002); }
        .badge { border-radius: 6px; padding: 0.4em 0.8em; font-weight: 500; }
        .form-control { border-radius: 8px; border: 1px solid #dee2e6; padding: 0.6rem 1rem; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-control:focus { border-color: #0dcaf0; box-shadow: 0 0 0 4px rgba(13, 202, 240, 0.15); }
    </style>
</h:head>
<h:body class="bg-light pb-5">
    <h:panelGroup rendered="#{loginController.loggedIn}">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.xhtml">THEi HR System</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><h:link outcome="index" value="Dashboard" styleClass="nav-link text-white"/></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="card shadow-sm border-0" style="max-width: 800px; margin: auto;">
                <div class="card-header bg-white fw-bold">
                    Create Training Enrollment
                </div>
                <div class="card-body">
                    <h:form>
                        <h:messages styleClass="alert alert-danger" />
                        
                        <h5 class="mb-3 border-bottom pb-2">Program Details</h5>
                        <div class="row g-3">
                            <div class="col-md-12">
                                <h:outputLabel value="Program Name:" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{enrollmentController.enrollment.programName}" required="true" requiredMessage="Program Name required" styleClass="form-control" />
                            </div>
                            
                            <div class="col-md-12">
                                <h:outputLabel value="Program Description:" styleClass="form-label fw-bold"/>
                                <h:inputTextarea value="#{enrollmentController.enrollment.programDescription}" label="Program Description" rows="3" styleClass="form-control"/>
                            </div>
                            
                            <div class="col-md-4">
                                <h:outputLabel value="Total Fee ($):" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{enrollmentController.enrollment.totalTrainingFee}" label="Total Fee" required="true" requiredMessage="Total Fee is required." styleClass="form-control" a:type="number" a:min="0" a:step="0.01">
                                    <f:convertNumber pattern="0.00" />
                                </h:inputText>
                            </div>
                            
                            <div class="col-md-4">
                                <h:outputLabel value="Enrollment Date:" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{enrollmentController.enrollment.enrollmentDate}" label="Enrollment Date" required="true" requiredMessage="Enrollment date is required" converterMessage="Enrollment Date must be in yyyy-MM-dd format" styleClass="form-control" a:placeholder="e.g. 2026-05-13">
                                    <f:convertDateTime pattern="yyyy-MM-dd" timeZone="Asia/Hong_Kong" />
                                </h:inputText>
                            </div>
                            
                            <div class="col-md-4">
                                <h:outputLabel value="Start Date:" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{enrollmentController.enrollment.trainingStartDate}" label="Start Date" required="true" requiredMessage="Start date is required" converterMessage="Start Date must be in yyyy-MM-dd format" styleClass="form-control" a:placeholder="e.g. 2026-05-20">
                                    <f:convertDateTime pattern="yyyy-MM-dd" timeZone="Asia/Hong_Kong" />
                                </h:inputText>
                            </div>
                        </div>
                        
                        <h5 class="mt-5 mb-3 border-bottom pb-2">Select Employees to Enroll</h5>
                        <div class="p-3 bg-white border rounded" style="max-height: 200px; overflow-y: auto;">
                            <h:selectManyCheckbox value="#{enrollmentController.selectedEmployeeIds}" layout="pageDirection" styleClass="form-check">
                                <f:selectItems value="#{enrollmentController.allEmployees}" var="emp" 
                                               itemValue="#{emp.id}" itemLabel="#{emp.firstName} #{emp.lastName} (#{emp.emailAddress})"/>
                            </h:selectManyCheckbox>
                        </div>
                        
                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <h:commandButton value="Save &amp; Start Timer" action="#{enrollmentController.saveEnrollment}" styleClass="btn btn-primary"/>
                            <h:commandButton value="Cancel" action="index?faces-redirect=true" immediate="true" styleClass="btn btn-outline-secondary"/>
                        </div>
                    </h:form>
                </div>
            </div>
        </div>
    </h:panelGroup>
    
    <h:panelGroup rendered="#{not loginController.loggedIn}">
        <div class="container mt-5 text-center">
            <h:outputText value="Access Denied: Please login first!" styleClass="alert alert-danger d-block fw-bold" />
        </div>
    </h:panelGroup>
</h:body>
</html>
