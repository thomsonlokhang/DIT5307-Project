<!DOCTYPE html>
<!-- 
  Employee Management View
  Allows HR staff to register new employees into the system, 
  and view a comprehensive table of all existing corporate employees. 
  Bound to EmployeeController.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:html5="http://xmlns.jcp.org/jsf/passthrough">
<h:head>
    <title>Manage Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Modern UI Enhancements -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa !important; }
        .navbar { background: linear-gradient(135deg, #0d42ff, #0dcaf0) !important; border-bottom: none; }
        .card { border-radius: 16px !important; box-shadow: 0 12px 35px rgba(0,0,0,0.05) !important; border: 1px solid rgba(0,0,0,0.05) !important; transition: transform 0.2s ease-in-out, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 15px 45px rgba(0,0,0,0.1) !important; }
        .btn-primary { background: linear-gradient(135deg, #0d42ff, #0dcaf0); border: none; border-radius: 8px; font-weight: 500; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(13, 202, 240, 0.4); }
        .btn-outline-primary { border-radius: 8px; font-weight: 500; }
        .table { border-collapse: separate; border-spacing: 0; }
        .table thead th { background-color: #f8f9fa; color: #495057; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; border-bottom: 2px solid #e9ecef; }
        .table-hover tbody tr:hover { background-color: #f8faff; transform: scale(1.002); }
        .badge { border-radius: 6px; padding: 0.4em 0.8em; font-weight: 500; }
        .form-control { border-radius: 8px; border: 1px solid #dee2e6; padding: 0.6rem 1rem; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-control:focus { border-color: #0dcaf0; box-shadow: 0 0 0 4px rgba(13, 202, 240, 0.15); }
    </style>
</h:head>
<h:body class="bg-light pb-5">
    
    <h:panelGroup rendered="#{loginController.loggedIn}">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.xhtml">THEi HR System</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><h:link outcome="index" value="Dashboard" styleClass="nav-link text-white"/></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <h2 class="mb-4">Manage Employees</h2>

            <div class="card shadow-sm mb-5 border-0">
                <div class="card-header bg-white fw-bold">
                    All Employees
                </div>
                <div class="card-body">
                    <h:dataTable value="#{employeeController.employeeList}" var="emp" styleClass="table table-striped table-hover align-middle mb-0" rendered="#{not empty employeeController.employeeList}">
                        <h:column><f:facet name="header">ID</f:facet>#{emp.id}</h:column>
                        <h:column><f:facet name="header">First Name</f:facet>#{emp.firstName}</h:column>
                        <h:column><f:facet name="header">Last Name</f:facet>#{emp.lastName}</h:column>
                        <h:column><f:facet name="header">Title</f:facet>#{emp.title}</h:column>
                        <h:column><f:facet name="header">Email</f:facet>#{emp.emailAddress}</h:column>
                    </h:dataTable>
                    <h:outputText value="No employees found." styleClass="text-muted" rendered="#{empty employeeController.employeeList}" />
                </div>
            </div>

            <div class="card shadow-sm border-0" style="max-width: 800px;">
                <div class="card-header bg-white fw-bold">
                    Add New Employee
                </div>
                <div class="card-body">
                    <h:form>
                        <h:messages styleClass="alert alert-danger" style="list-style-type: none; padding-left: 15px;" globalOnly="true" />
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <h:outputLabel value="First Name: *" styleClass="form-label fw-bold text-danger"/>
                                <h:inputText id="firstName" value="#{employeeController.newEmployee.firstName}" label="First Name" required="true" requiredMessage="First Name is required." styleClass="form-control" />
                                <h:message for="firstName" styleClass="text-danger small mt-1 d-block" />
                            </div>
                            <div class="col-md-6">
                                <h:outputLabel value="Last Name: *" styleClass="form-label fw-bold text-danger"/>
                                <h:inputText id="lastName" value="#{employeeController.newEmployee.lastName}" label="Last Name" required="true" requiredMessage="Last Name is required." styleClass="form-control"/>
                                <h:message for="lastName" styleClass="text-danger small mt-1 d-block" />
                            </div>
                            
                            <div class="col-md-4">
                                <h:outputLabel value="Title:" styleClass="form-label fw-bold"/>
                                <h:inputText id="title" value="#{employeeController.newEmployee.title}" label="Title" styleClass="form-control" html5:placeholder="MR, MS, DR"/>
                                <h:message for="title" styleClass="text-danger small mt-1 d-block" />
                            </div>
                            <div class="col-md-4">
                                <h:outputLabel value="Employee ID: *" styleClass="form-label fw-bold text-danger"/>
                                <h:inputText id="empId" value="#{employeeController.newEmployee.employeeIdNumber}" label="Employee ID" required="true" requiredMessage="Employee ID is required." styleClass="form-control"/>
                                <h:message for="empId" styleClass="text-danger small mt-1 d-block" />
                            </div>
                            <div class="col-md-4">
                                <h:outputLabel value="HKID: *" styleClass="form-label fw-bold text-danger"/>
                                <h:inputText id="hkid" value="#{employeeController.newEmployee.hkidNumber}" label="HKID" required="true" requiredMessage="HKID is required." validatorMessage="Invalid HKID format" styleClass="form-control">
                                    <f:validateRegex pattern="^[A-Za-z]{1,2}[0-9]{6}\(?[0-9Aa]\)?$" />
                                </h:inputText>
                                <h:message for="hkid" styleClass="text-danger small mt-1 d-block" />
                            </div>

                            <div class="col-md-4">
                                <h:outputLabel value="Department:" styleClass="form-label fw-bold"/>
                                <h:inputText id="dept" value="#{employeeController.newEmployee.department}" label="Department" styleClass="form-control"/>
                                <h:message for="dept" styleClass="text-danger small mt-1 d-block" />
                            </div>
                            <div class="col-md-4">
                                <h:outputLabel value="Mobile Phone:" styleClass="form-label fw-bold"/>
                                <h:inputText id="mobile" value="#{employeeController.newEmployee.mobilePhoneNumber}" label="Mobile Phone" styleClass="form-control"/>
                                <h:message for="mobile" styleClass="text-danger small mt-1 d-block" />
                            </div>
                            <div class="col-md-12">
                                <h:outputLabel value="Email:" styleClass="form-label fw-bold"/>
                                <h:inputText id="email" value="#{employeeController.newEmployee.emailAddress}" label="Email Address" styleClass="form-control"/>
                                <h:message for="email" styleClass="text-danger small mt-1 d-block" />
                            </div>
                        </div>

                        <div class="mt-4">
                            <h:commandButton value="Save Employee" action="#{employeeController.saveEmployee}" styleClass="btn btn-primary"/>
                            <h:link outcome="index" value="Cancel" styleClass="btn btn-outline-secondary ms-2"/>
                        </div>
                    </h:form>
                </div>
            </div>
            
        </div>
    </h:panelGroup>

    <h:panelGroup rendered="#{not loginController.loggedIn}">
        <div class="container mt-5 text-center">
            <h:outputText value="Access Denied: Please login first!" styleClass="alert alert-danger d-block fw-bold" />
        </div>
    </h:panelGroup>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
