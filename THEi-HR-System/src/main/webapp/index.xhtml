<!DOCTYPE html>
<!-- 
  Main Dashboard View
  Displays navigation links, active payment warnings (synced with EJB Timers), 
  and a top-level list of all enrolled training courses.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>HR System - Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Modern UI Enhancements -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa !important; }
        .navbar { background: linear-gradient(135deg, #0d42ff, #0dcaf0) !important; border-bottom: none; }
        .card { border-radius: 16px !important; box-shadow: 0 12px 35px rgba(0,0,0,0.05) !important; border: 1px solid rgba(0,0,0,0.05) !important; transition: transform 0.2s ease-in-out, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 15px 45px rgba(0,0,0,0.1) !important; }
        .btn-primary { background: linear-gradient(135deg, #0d42ff, #0dcaf0); border: none; border-radius: 8px; font-weight: 500; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(13, 202, 240, 0.4); }
        .btn-outline-primary { border-radius: 8px; font-weight: 500; }
        .table { border-collapse: separate; border-spacing: 0; }
        .table thead th { background-color: #f8f9fa; color: #495057; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; border-bottom: 2px solid #e9ecef; }
        .table-hover tbody tr:hover { background-color: #f8faff; transform: scale(1.002); }
        .badge { border-radius: 6px; padding: 0.4em 0.8em; font-weight: 500; }
        .form-control { border-radius: 8px; border: 1px solid #dee2e6; padding: 0.6rem 1rem; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-control:focus { border-color: #0dcaf0; box-shadow: 0 0 0 4px rgba(13, 202, 240, 0.15); }
    </style>
</h:head>
<h:body class="bg-light">
    
    <h:panelGroup rendered="#{loginController.loggedIn}">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.xhtml">THEi HR System</a>
                <div class="collapse navbar-collapse">
                    <h:form styleClass="d-flex ms-auto my-2 my-lg-0 align-items-center">
                        <ul class="navbar-nav me-3">
                            <li class="nav-item"><h:commandLink action="enrollment?faces-redirect=true" value="Create Enrollment" styleClass="nav-link text-white" /></li>
                            <li class="nav-item"><h:commandLink action="employees?faces-redirect=true" value="Manage Employees" styleClass="nav-link text-white" /></li>
                        </ul>
                        <h:commandButton action="#{loginController.logout}" value="Logout" styleClass="btn btn-outline-light btn-sm" />
                    </h:form>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="row">
                <!-- Active Warnings Column -->
                <h:panelGroup rendered="#{not empty dashboardController.activeWarnings}">
                <div class="col-md-12 mb-4">
                    <div class="card shadow-sm border-0 border-start border-danger border-4">
                        <div class="card-header bg-white text-danger fw-bold">
                            <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Active Warnings</h5>
                        </div>
                        <div class="card-body">
                            <h:dataTable value="#{dashboardController.activeWarnings}" var="warning" styleClass="table table-hover align-middle mb-0" rendered="#{not empty dashboardController.activeWarnings}">
                                <h:column>
                                    <f:facet name="header">Warning Date</f:facet>
                                    <span class="badge bg-secondary">
                                        <h:outputText value="#{warning.warningDate}"><f:convertDateTime pattern="yyyy-MM-dd HH:mm" timeZone="Asia/Hong_Kong" /></h:outputText>
                                    </span>
                                </h:column>
                                <h:column>
                                    <f:facet name="header">Program</f:facet>
                                    <h:link outcome="enrollmentDetail" styleClass="fw-bold text-decoration-none">
                                        <f:param name="id" value="#{warning.associatedEnrollment.id}" />
                                        <h:outputText value="#{warning.associatedEnrollment.programName}" />
                                    </h:link>
                                </h:column>
                                <h:column>
                                    <f:facet name="header">Status</f:facet>
                                    <span class="badge bg-danger fs-6"><h:outputText value="#{dashboardController.getDaysRemainingMessage(warning.associatedEnrollment)}" /></span>
                                </h:column>
                            </h:dataTable>
                        </div>
                    </div>
                </div>
                </h:panelGroup>

                <!-- All Enrollments Column -->
                <div class="col-md-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white text-dark fw-bold d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">All Enrollments</h5>
                        </div>
                        <div class="card-body">
                            <h:dataTable value="#{dashboardController.allEnrollments}" var="enrollment" styleClass="table table-striped table-hover align-middle mb-0" rendered="#{not empty dashboardController.allEnrollments}">
                                <h:column>
                                    <f:facet name="header">ID</f:facet>
                                    <h:link value="#{enrollment.id}" outcome="enrollmentDetail" styleClass="fw-bold text-decoration-none">
                                        <f:param name="id" value="#{enrollment.id}" />
                                    </h:link>
                                </h:column>
                                <h:column>
                                    <f:facet name="header">Program</f:facet>
                                    <h:outputText value="#{enrollment.programName}" />
                                </h:column>
                                <h:column>
                                    <f:facet name="header">Start Date</f:facet>
                                    <h:outputText value="#{enrollment.trainingStartDate}">
                                        <f:convertDateTime pattern="yyyy-MM-dd" timeZone="Asia/Hong_Kong" />
                                    </h:outputText>
                                </h:column>
                                <h:column>
                                    <f:facet name="header">Overdue?</f:facet>
                                    <h:outputText value="#{enrollment.paymentOverdue ? 'Yes' : 'No'}" styleClass="badge #{enrollment.paymentOverdue ? 'bg-warning text-dark' : 'bg-light text-dark'}" />
                                </h:column>
                                <h:column>
                                    <f:facet name="header">Fully Paid?</f:facet>
                                    <h:outputText value="#{enrollment.fullyPaid ? 'Yes' : 'No'}" styleClass="badge #{enrollment.fullyPaid ? 'bg-success' : 'bg-secondary'}"/>
                                </h:column>
                                <h:column>
                                    <f:facet name="header">Actions</f:facet>
                                    <h:link value="Manage" outcome="enrollmentDetail" styleClass="btn btn-sm btn-outline-primary">
                                        <f:param name="id" value="#{enrollment.id}" />
                                    </h:link>
                                </h:column>
                            </h:dataTable>
                            <h:outputText value="No enrollments found." styleClass="text-muted" rendered="#{empty dashboardController.allEnrollments}" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </h:panelGroup>
    
    <div class="container mt-5">
        <h:outputText value="Access Denied: Please login first!" styleClass="alert alert-danger d-block text-center fw-bold" rendered="#{not loginController.loggedIn}" />
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
</h:body>
</html>
